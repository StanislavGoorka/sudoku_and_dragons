<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Foreground layer of the adaptive icon: a dragon's eye over a golden sudoku box.
    Launchers crop the 1024 canvas to its middle ~683 px and then to a circle or squircle,
    so everything stays within ~320 px of the centre.
  -->
  <defs>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="30%" stop-color="#ffd156"/>
      <stop offset="68%" stop-color="#ff8a1f"/>
      <stop offset="100%" stop-color="#b3360c"/>
    </radialGradient>
    <!-- User-space units: a bounding-box gradient is invalid on the perfectly straight grid lines. -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="762">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Sudoku box: rounded frame and the lines between its 3x3 cells. -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <rect x="262" y="262" width="500" height="500" rx="110" stroke-width="26"/>
    <g stroke-width="12" opacity="0.75">
      <line x1="429" y1="275" x2="429" y2="749"/>
      <line x1="595" y1="275" x2="595" y2="749"/>
      <line x1="275" y1="429" x2="749" y2="429"/>
      <line x1="275" y1="595" x2="749" y2="595"/>
    </g>
  </g>

  <!-- Fiery glow behind the eye. -->
  <path d="M272 512 C372 352 652 352 752 512 C652 672 372 672 272 512 Z" fill="#ff7a1a" opacity="0.6" filter="url(#glow)"/>

  <!-- The eye: almond-shaped iris, dark rim, slit pupil and a glint. -->
  <path d="M282 512 C380 366 644 366 742 512 C644 658 380 658 282 512 Z"
        fill="url(#iris)" stroke="#120c1a" stroke-width="18" stroke-linejoin="round"/>
  <path d="M512 398 C552 452 552 572 512 626 C472 572 472 452 512 398 Z" fill="#120c1a"/>
  <ellipse cx="462" cy="460" rx="26" ry="17" fill="#ffffff" opacity="0.85" transform="rotate(-25 462 460)"/>
  <circle cx="575" cy="560" r="9" fill="#ffffff" opacity="0.5"/>
</svg>
