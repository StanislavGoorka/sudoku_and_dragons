<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15101f" />
    <title>Sudoku & Dragons</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #15101f;
      }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px;
        color: #fdf8ff;
        background: #160f36;
        font: 600 20px system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #startup button {
        padding: 16px 24px;
        border: 0;
        border-radius: 16px;
        background: #ffd56a;
        color: #2b2156;
        font: inherit;
        cursor: pointer;
      }
      #app canvas { position: relative; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="startup" role="status" aria-live="polite"><p>Ładowanie gry…</p></div>
    <div id="app"></div>
    <script type="module" src="/src/game/bootstrap.ts"></script>
  </body>
</html>
